<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תיק עבודות | NNsites</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background-color: #f9f9f9;
        }

        /* Navbar - זהה לשאר האתר */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 28px; font-weight: 800; }
        .nav-links a { text-decoration: none; color: #000; font-weight: 700; margin-right: 20px; }

        /* כותרת הדף */
        .header {
            text-align: center;
            padding: 60px 20px;
        }

        .header h1 { font-size: 3rem; font-weight: 800; }

        /* גריד העבודות */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            padding: 0 8% 80px;
        }

        /* עיצוב הפרויקט עם אפקט הובר */
        .project-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            height: 300px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .project-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        /* שכבת ההובר (Overlay) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .project-card:hover img {
            transform: scale(1.1);
        }

        .project-card:hover .overlay {
            opacity: 1;
        }

        .overlay h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .project-card:hover h3 {
            transform: translateY(0);
        }

        /* כפתור בתוך ההובר */
        .view-btn {
            background: #fff;
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            text-decoration: none;
            font-size: 0.9rem;
            transform: translateY(20px);
            transition: all 0.4s ease 0.1s;
        }

        .project-card:hover .view-btn {
            transform: translateY(0);
        }

        .view-btn:hover {
            background: #2563eb;
            color: #fff;
        }

        @media (max-width: 768px) {
            .portfolio-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">NNsites</div>
        <div class="nav-links">
            <a href="index.html">דף הבית</a>
        </div>
    </nav>

    <div class="header">
        <h1>תיק עבודות</h1>
        <p>ככה זה נראה כשעושים את זה מקצועי.</p>
    </div>

    <section class="portfolio-grid">
        <div class="project-card">
            <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=800" alt="בניית אתרים">
            <div class="overlay">
                <h3></h3>
                <a href="#" class="view-btn">צפה בפרויקט</a>
            </div>
        </div>

    </section>
</body>
</html>
