<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדף לא נמצא | NNsites</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            font-weight: 700;
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .error-code {
            font-size: 20rem;
            line-height: 1;
            background: linear-gradient(180deg, #000 30%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.05;
            position: absolute;
            z-index: 0;
            user-select: none;
        }
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="error-code">404</div>

    <div class="content px-6">
        <div class="text-7xl mb-6">😉</div>
        <h1 class="text-5xl md:text-7xl font-800 mb-6 tracking-tighter">
            הדף לא נמצא, <br><span class="text-blue-600">תכף ישוב</span>
        </h1>
        <p class="text-xl md:text-2xl text-gray-600 mb-12 font-bold max-w-md mx-auto leading-tight">
            נראה שהגעת למקום שעדיין נמצא בבנייה... <br>נחזור לפעילות מלאה בקרוב.
        </p>
        
        <div class="flex justify-center">
            <a href="index.html" class="bg-black text-white px-12 py-4 rounded-full font-800 text-xl shadow-2xl hover:bg-blue-600 transition-all duration-300 transform hover:scale-105">
                חזרה לדף הבית
            </a>
        </div>
    </div>

</body>
</html>
